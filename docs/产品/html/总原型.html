<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康管理平台 - 原型总览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 900px; width: 100%; padding: 40px 24px; }
    h1 { font-size: 28px; color: #1a2744; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: #666; text-align: center; margin-bottom: 40px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card {
      background: white; border-radius: 12px; padding: 32px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer; transition: all 0.2s;
      text-decoration: none; color: inherit;
      display: block;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .card-icon { font-size: 36px; margin-bottom: 16px; }
    .card-title { font-size: 18px; font-weight: 600; color: #1a2744; margin-bottom: 8px; }
    .card-desc { font-size: 13px; color: #666; line-height: 1.6; }
    .card-tag {
      display: inline-block; margin-top: 12px; padding: 3px 10px;
      border-radius: 4px; font-size: 12px;
    }
    .tag-pc { background: #e8f4fd; color: #1890ff; }
    .tag-mobile { background: #f0f9eb; color: #52c41a; }
    .sprint-badge {
      position: absolute; top: 16px; right: 16px;
      background: #f5f5f5; color: #999; font-size: 11px;
      padding: 2px 8px; border-radius: 3px;
    }
    .card { position: relative; }
    .footer { text-align: center; margin-top: 40px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <h1>健康管理平台</h1>
    <p class="subtitle">原型总览 - 点击进入各功能模块</p>
    <div class="cards">
      <a class="card" href="../index.html">
        <span class="sprint-badge">Sprint1</span>
        <div class="card-icon">📋</div>
        <div class="card-title">就诊流程闭环日志</div>
        <div class="card-desc">查看完整就诊流程，包括7个环节的业务数据和接口调用详情。支持已完成/进行中/异常三种状态。</div>
        <span class="card-tag tag-pc">PC管理后台</span>
      </a>
      <a class="card" href="../Sprint1/US-002-共享床位使用明细/共享床位使用明细.html">
        <span class="sprint-badge">Sprint1</span>
        <div class="card-icon">🛏️</div>
        <div class="card-title">共享床位使用明细</div>
        <div class="card-desc">移动端工作台入口，查看各病区共享床位使用情况，支持病区名称搜索。</div>
        <span class="card-tag tag-mobile">移动端工作台</span>
      </a>
    </div>
    <div class="footer">健康管理平台 Sprint1 | 共 2 个功能点</div>
  </div>
</body>
</html>
